name: Build SCAFFOLDING ULTRA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate assets
        run: python3 tools/generate_resources.py
      - name: Build Forge mod
        run: gradle build --no-daemon --stacktrace
      - name: Verify and package
        run: |
          mkdir -p dist
          cp build/libs/SCAFFOLDING-ULTRA-2.0-FORGE-1.21-2.0.0.jar dist/SCAFFOLDING-ULTRA-2.0-FORGE-1.21.jar
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/SCAFFOLDING-ULTRA-2.0-FORGE-1.21.jar'); assert 'META-INF/mods.toml' in z.namelist(); assert 'assets/scaffolding_ultra/models/block/standard.json' in z.namelist(); assert 'data/scaffolding_ultra/recipe/standard.json' in z.namelist(); assert 'com/scaffoldingultra/ScaffoldingUltra.class' in z.namelist(); assert z.testzip() is None"
      - uses: actions/upload-artifact@v4
        with:
          name: SCAFFOLDING-ULTRA-2.0-FORGE-1.21
          path: dist/*.jar
          if-no-files-found: error
